[global_tags]
  # Adicionar tags globais aqui se necessário

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "telegraf"
  omit_hostname = false
  logfile = ""
  debug = false

################################################################################
#                            OUTPUT PLUGINS                                   #
################################################################################

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  
  # Garantir que os tipos de dados sejam preservados
  [outputs.influxdb_v2.tagpass]
  
  timeout = "10s"
  write_consistency = "any"

################################################################################
#                            INPUT PLUGINS                                    #
################################################################################

# MQTT Consumer - Todos os tópicos incoming
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1884"]
  topics = ["+/incoming/#"]
  username = "sustainolive"
  password = "sustainolive"
  qos = 0
  connection_timeout = "30s"
  read_timeout = "30s"
  keep_alive = 60
  
  # Data format configuration
  data_format = "json"
  json_name_key = "thingId"
  json_string_fields = ["thingId"]
  
  # Tags que devem ser extraídas
  tag_keys = ["thingId"]
  
  # Campo de timestamp
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05.000Z"

################################################################################
#                            PROCESSOR PLUGINS                                #
################################################################################

# Converter valores numéricos string para números reais
[[processors.converter]]
  [processors.converter.fields]
    float = ["temperature", "value"]
    int = ["state"]
