[global_tags]
  # Adicionar tags globais aqui se necessário

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "telegraf"
  omit_hostname = false
  logfile = ""
  debug = false

################################################################################
#                            OUTPUT PLUGINS                                   #
################################################################################

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "10s"

################################################################################
#                            INPUT PLUGINS                                    #
################################################################################

# MQTT Consumer - Todos os tópicos incoming
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1884"]
  topics = ["+/incoming/#"]
  username = "sustainolive"
  password = "sustainolive"
  qos = 0
  connection_timeout = "30s"
  
  # Data format configuration
  data_format = "json"
  json_name_key = "thingId"
  json_string_fields = ["thingId"]
  
  # Tags que devem ser extraídas
  tag_keys = ["thingId"]
  
  # Use current time as timestamp since incoming messages don't have a timestamp field
  # The timestamp is added later by Ditto's mapping script

# HTTP Input - API HTTP do Ditto
[[inputs.http]]
  urls = ["http://ditto:8080/api/2/things"]
  method = "GET"
  interval = "30s"
  
  # Autenticação básica (se necessário)
  username = "ditto"
  password = "ditto"
  
  # Headers customizados
  [inputs.http.headers]
    Accept = "application/json"
  
  # Data format configuration
  data_format = "json"
  
  # Opções adicionais
  response_timeout = "10s"
  insecure_skip_verify = false

################################################################################
#                            PROCESSOR PLUGINS                                #
################################################################################

# Converter valores numéricos string para números reais
[[processors.converter]]
  [processors.converter.fields]
    float = ["temperature", "value"]
