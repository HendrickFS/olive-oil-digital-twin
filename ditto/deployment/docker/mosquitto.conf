# MQTT TCP listener
listener 1884 0.0.0.0
protocol mqtt

# WebSocket listener  
listener 9002 0.0.0.0
protocol websockets

# Authentication
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Persistence
persistence true
persistence_location /mosquitto/data/

