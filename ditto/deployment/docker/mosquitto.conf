## Mosquitto configuration with TLS and password-based authentication
# Persistence and logging
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Listener plain MQTT (existing non-TLS listener)
listener 1884
protocol mqtt

# Listener MQTT TLS (default MQTT over TLS)
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Websockets (if needed)
listener 9002
protocol websockets

# Security
allow_anonymous false
password_file /mosquitto/config/passwd

# Optional: ACL file to restrict topic access
#acl_file /mosquitto/config/acl

# Recommended: tune limits in production
#max_inflight_messages 1000
#message_size_limit 10240

